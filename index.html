                        playSound('tada');
                        launchConfetti(150);
                        setFinalSummary({
                            weightedScore,
                            stations: newStations,
                            totalPrize: newStations.reduce((sum, st) => sum + (st.prize || 0), 0)
                        });
                        setView('summary');
                    }, 500);
                }
            };

            const renderView = () => {
                // --- מסך סיכום סופי ---
                if (view === 'summary' && finalSummary) {
                    const { weightedScore, stations: sumStations, totalPrize } = finalSummary;
                    const bgStyle = generalBgUrl ? { backgroundImage: `url(${generalBgUrl})`, backgroundSize: 'cover', backgroundPosition: 'center' } : {};
                    const scoreColor = weightedScore >= 85 ? 'text-green-500' : weightedScore >= 60 ? 'text-amber-500' : 'text-red-500';
                    const scoreBg = weightedScore >= 85 ? 'from-green-900 to-green-700' : weightedScore >= 60 ? 'from-amber-900 to-amber-700' : 'from-red-900 to-red-700';
                    const scoreEmoji = weightedScore >= 85 ? '🏆' : weightedScore >= 60 ? '🌟' : '💪';

                    return (
                        <div className="min-h-[100dvh] flex flex-col items-center justify-start p-4 relative overflow-auto"
                            style={generalBgUrl ? bgStyle : { background: 'linear-gradient(135deg, #1a1a2e, #16213e, #0f3460)' }}>
                            {generalBgUrl && <div className="absolute inset-0 bg-black/60 z-0" />}

                            <div className="relative z-10 w-full max-w-lg mx-auto mt-4 mb-8 animate-fade-in">
                                {/* כותרת */}
                                <div className="text-center mb-6">
                                    <div className="text-7xl mb-3 animate-pop-in">{scoreEmoji}</div>
                                    <h1 className="text-3xl md:text-4xl font-black text-white drop-shadow-xl mb-1">כל הכבוד, {studentName}!</h1>
                                    <p className="text-stone-300 font-bold">סיימת את מסע ירושלים</p>
                                </div>

                                {/* ציון גדול */}
                                <div className={`bg-gradient-to-br ${scoreBg} rounded-3xl p-6 text-center mb-4 shadow-2xl border border-white/10`}>
                                    <div className="text-white/70 font-bold text-sm uppercase tracking-widest mb-1">ציון סופי משוקלל</div>
                                    <div className={`text-8xl font-black ${scoreColor} drop-shadow-xl`}>{weightedScore}</div>
                                    <div className="text-white/60 text-sm mt-1">מתוך 100</div>
                                    {totalPrize > 0 && (
                                        <div className="mt-3 bg-black/30 rounded-xl px-4 py-2 inline-block">
                                            <span className="text-amber-400 font-black text-lg">💰 ₪{totalPrize.toLocaleString()}</span>
                                            <span className="text-white/60 text-sm mr-2">פרס מצטבר</span>
                                        </div>
                                    )}
                                </div>

                                {/* פירוט לפי תחנה */}
                                <div className="bg-white/10 backdrop-blur rounded-2xl p-4 mb-4 border border-white/20">
                                    <h3 className="text-white font-black text-center mb-3 text-sm uppercase tracking-wider">פירוט תחנות</h3>
                                    <div className="space-y-2">
                                        {sumStations.map(st => {
                                            const cfg = STATION_SHEET_CONFIG[st.id];
                                            if (!cfg) return null;
                                            const weight = cfg.weight * 100;
                                            const contribution = Math.round((st.score || 0) * cfg.weight);
                                            const typeLabel = st.type === 'quiz' ? '📝' : st.type === 'memory' ? '🔗' : '💰';
                                            const barW = st.score || 0;
                                            return (
                                                <div key={st.id} className="bg-white/5 rounded-xl p-3">
                                                    <div className="flex justify-between items-center mb-1">
                                                        <span className="text-white font-bold text-sm">{typeLabel} {st.name}</span>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-white/50 text-xs">×{weight}%</span>
                                                            <span className="text-amber-400 font-black text-sm">{st.score || 0}</span>
                                                            <span className="text-white/40 text-xs">→ {contribution}נק׳</span>
                                                        </div>
                                                    </div>
                                                    <div className="w-full bg-white/10 rounded-full h-2">
                                                        <div className="h-2 rounded-full transition-all duration-1000"
                                                            style={{ width: `${barW}%`, background: barW >= 85 ? '#22c55e' : barW >= 60 ? '#f59e0b' : '#ef4444' }} />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="mt-3 pt-3 border-t border-white/20 flex justify-between items-center">
                                        <span className="text-white/70 text-sm font-bold">סה״כ משוקלל</span>
                                        <span className={`text-2xl font-black ${scoreColor}`}>{weightedScore}</span>
                                    </div>
                                </div>

                                {/* כפתור חזרה */}
                                <button onClick={() => { setView('map'); setGlobalMessage('🏆 סיימת את המסע!'); }}
                                    className="w-full bg-amber-500 hover:bg-amber-600 text-white font-black text-lg p-4 rounded-xl shadow-lg transition-transform hover:-translate-y-1">
                                    חזרה למפה 🗺️
                                </button>
                            </div>
                        </div>
                    );
                }
                if (view === 'login') {
                    const bgStyle = generalBgUrl ? { backgroundImage: `url(${generalBgUrl})`, backgroundSize: 'cover', backgroundPosition: 'center' } : {};
                    const isPasswordRequired = typeof studentPassword === 'string' && studentPassword.trim() !== '';
                    const safeClasses = Array.isArray(classes) ? classes : defaultClasses;
                    const hasClasses = safeClasses.length > 0;
                    
                    return (
                    <div className={`flex flex-col items-center justify-center min-h-[100dvh] p-4 ${generalBgUrl ? '' : 'bg-stars bg-stone-100'} relative`} style={bgStyle}>
                    {generalBgUrl && <div className="absolute inset-0 bg-stone-900/40 backdrop-blur-sm z-0"></div>}
                    
                    <div className="absolute top-4 left-4 z-50">
                    <button onClick={() => setView('admin')} className="bg-white/90 p-3 rounded-full shadow-lg text-stone-600 hover:text-amber-600 transition-all hover:scale-110" title="כניסה למנהלים">
                    <Icon name="settings" size={24} />
                    </button>
                    </div>
                    
                    <div className="relative z-10 bg-white/95 backdrop-blur-md p-6 md:p-8 rounded-3xl shadow-2xl max-w-sm w-full border-t-8 border-amber-500 text-center animate-fade-in">
                    <Icon name="map" size={60} className="mx-auto text-amber-500 mb-4 animate-bounce-slow drop-shadow-md" />
                    <h1 className="text-3xl font-black text-amber-900 mb-2 drop-shadow-sm">מסע בירושלים</h1>
                    <p className="text-stone-500 font-bold mb-6">התחברו כדי להתחיל במשחק</p>
                    
                    {loginError && (
                    <div className="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm font-bold border border-red-200 animate-fade-in">
                    <Icon name="alert-circle" size={16} className="inline mr-1 -mt-1" />
                    {loginError}
                    </div>
                    )}

                    <form onSubmit={handleLogin} className="space-y-4" noValidate>
                    <input type="text" value={studentName} onChange={(e) => setStudentName(e.target.value)} placeholder="הקלד את שמך (לדוגמה: ירון מלאכי)" className="w-full text-right text-lg p-3 rounded-xl bg-stone-50 border-2 border-stone-200 focus:outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-100 transition-all" />
                    
                    {hasClasses && (
                    <select value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)} className="w-full text-right text-lg p-3 rounded-xl bg-stone-50 border-2 border-stone-200 focus:outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-100 transition-all cursor-pointer">
                    <option value="" disabled>בחר כיתה...</option>
                    {safeClasses.map((cls, i) => (
                    <option key={i} value={cls}>{cls}</option>
                    ))}
                    </select>
                    )}

                    {isPasswordRequired && (
                    <input type="password" value={inputPassword} onChange={(e) => setInputPassword(e.target.value)} placeholder="סיסמת כניסה (שאל את המורה)" className="w-full text-center text-lg p-3 rounded-xl bg-stone-50 border-2 border-stone-200 focus:outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-100 transition-all" />
                    )}

                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-white font-black text-xl p-4 rounded-xl shadow-lg transition-transform hover:-translate-y-1 mt-2">התחל מסע!</button>
                    </form>
                    </div>
                    </div>
                    );
                }
                
                if (view === 'admin') {
                    if (!adminAuthenticated) {
                        return <AdminLogin onSuccess={() => setAdminAuthenticated(true)} />;
                    }
                    return <AdminPanel stations={stations} setStations={setStations} mapUrls={mapUrls} setMapUrls={setMapUrls} webhookUrl={webhookUrl} setWebhookUrl={setWebhookUrl} generalBgUrl={generalBgUrl} setGeneralBgUrl={setGeneralBgUrl} classes={classes} setClasses={setClasses} studentPassword={studentPassword} setStudentPassword={setStudentPassword} onClose={() => { setAdminAuthenticated(false); setView('login'); }} onSave={saveToCloudAndLocal} />;
                }

                if (view === 'map') {
                    const safeMapUrls = mapUrls || defaultMapUrls;
                    const safeStations = Array.isArray(stations) ? stations : defaultStations;
                    const currentMapImage = isPortrait ? (safeMapUrls.portrait || defaultMapUrls.portrait) : (safeMapUrls.landscape || defaultMapUrls.landscape);
                    
                    return (
                    <div className="min-h-[100dvh] bg-stone-900 flex flex-col items-center justify-center relative overflow-hidden">
                    <header className="absolute top-4 right-4 bg-white/90 px-4 py-2 rounded-full shadow-lg z-50 text-sm flex gap-2">
                    <span className="font-black text-amber-700">{studentName}</span>
                    {selectedClass && <span className="font-bold text-stone-500">| {selectedClass}</span>}
                    </header>
                    
                    {globalMessage && (
                    <div className="absolute top-20 z-50 animate-bounce-slow">
                    <div className="bg-green-500 text-white px-6 py-3 rounded-full font-black shadow-xl text-center border-4 border-green-300">
                    <Icon name="award" size={24} className="inline mr-2 -mt-1" /> {globalMessage}
                    </div>
                    </div>
                    )}

                    <div className={`relative w-full h-[100dvh] md:h-auto md:max-w-5xl md:aspect-video bg-stone-800 shadow-2xl animate-fade-in ${isPortrait ? 'overflow-hidden' : ''}`}>
                    {currentMapImage && <img src={currentMapImage} alt="Map" className={`absolute inset-0 w-full h-full ${isPortrait ? 'object-cover' : 'object-contain md:object-cover'} opacity-90`} />}
                    
                    {safeStations.map((st, idx) => {
                    if (typeof st !== 'object' || !st) return null;
                    const pinX = isPortrait ? (st.portraitX ?? st.x ?? 50) : (st.x ?? 50);
                    const pinY = isPortrait ? (st.portraitY ?? st.y ?? 50) : (st.y ?? 50);
                    const isLocked = !st.isUnlocked;
                    const isCompleted = st.completed;
                    
                    let pinColor = isCompleted ? 'bg-green-500 ring-green-300' : (isLocked ? 'bg-stone-500 ring-stone-400 opacity-80 grayscale' : 'bg-amber-500 ring-amber-300 animate-pulse');
                    let cursor = isLocked ? 'cursor-not-allowed' : 'cursor-pointer';
                    
                    return (
                    <div key={st.id || idx} 
                    style={{ left: `${pinX}%`, top: `${pinY}%` }} 
                    onClick={() => { 
                    if (!isLocked && !isCompleted) { 
                    setActiveStationId(st.id); 
                    playSound('flip');
                    if(st.videoUrl && st.videoUrl.trim() !== '') {
                    setShowVideo(true);
                    } else {
                    setShowVideo(false);
                    }
                    setView('game'); 
                    } 
                    }} 
                    className={`absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center map-pin ${cursor} z-20`}
                    >
                    <div className="bg-white/95 backdrop-blur px-3 py-1 text-xs md:text-sm font-black rounded-full mb-2 shadow-lg text-stone-800 whitespace-nowrap border border-stone-100">
                    {st.name || `תחנה ${idx+1}`}
                    </div>
                    <div className={`w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-white shadow-2xl ring-4 ${pinColor}`}>
                    {isCompleted ? <Icon name="check" size={24} /> : (isLocked ? <Icon name="lock" size={20} /> : <Icon name="star" size={24} />)}
                    </div>
                    </div>
                    );
                    })}
                    </div>
                    </div>
                    );
                }

                if (view === 'game') {
                    const safeStations = Array.isArray(stations) ? stations : defaultStations;
                    const currentStation = safeStations.find(s => s.id === activeStationId);
                    
                    if (!currentStation) {
                    setView('map');
                    return null;
                    }

                    const hasVideo = currentStation.videoUrl && currentStation.videoUrl.trim() !== '';
                    const embedUrl = hasVideo ? getEmbedUrl(currentStation.videoUrl) : null;

                    // מסך המשחק עם טאבים (סרטון + משחק)
                    const bgUrl = currentStation.backgroundUrl || generalBgUrl;
                    const bgStyle = bgUrl ? { backgroundImage: `url(${bgUrl})`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundAttachment: 'fixed' } : {};

                    return (
                    <div className={`min-h-[100dvh] p-4 relative flex flex-col ${bgUrl ? '' : 'bg-stone-100'} animate-fade-in`} style={bgStyle}>
                    {bgUrl && <div className="absolute inset-0 bg-stone-900/30 pointer-events-none z-0"></div>}
                    
                    {/* כותרת עליונה */}
                    <div className="relative z-10 w-full max-w-4xl mx-auto flex justify-between items-center bg-white/90 backdrop-blur-md p-4 rounded-xl shadow-lg mb-4 border border-white/50">
                    <div>
                    <h2 className="text-lg md:text-2xl font-black text-stone-800 drop-shadow-sm">{currentStation.name}</h2>
                    <p className="text-stone-500 font-bold text-xs md:text-sm">{currentStation.description}</p>
                    </div>
                    <button onClick={() => setView('map')} className="bg-stone-100 hover:bg-stone-200 text-stone-700 px-4 py-2 rounded-lg font-bold flex items-center gap-1 shadow-sm transition-all"><Icon name="x" size={20} /> חזרה למפה</button>
                    </div>

                    {/* טאבים - מוצגים רק אם יש סרטון */}
                    {hasVideo && (
                    <div className="relative z-10 w-full max-w-4xl mx-auto flex gap-2 mb-4">
                    <button
                    onClick={() => setShowVideo(true)}
                    className={`flex-1 py-3 rounded-xl font-bold text-base flex items-center justify-center gap-2 transition-all shadow-md ${showVideo ? 'bg-red-500 text-white' : 'bg-white/80 text-stone-600 hover:bg-white'}`}
                    >
                    <Icon name="play-circle" size={20} /> 📹 סרטון
                    </button>
                    <button
                    onClick={() => setShowVideo(false)}
                    className={`flex-1 py-3 rounded-xl font-bold text-base flex items-center justify-center gap-2 transition-all shadow-md ${!showVideo ? 'bg-amber-500 text-white' : 'bg-white/80 text-stone-600 hover:bg-white'}`}
                    >
                    <Icon name="gamepad-2" size={20} /> 🎮 משחק
                    </button>
                    </div>
                    )}
                    
                    {/* תוכן: סרטון או משחק */}
                    <div className="relative z-10 flex-1">
                    {hasVideo && showVideo ? (
                    <div className="w-full max-w-4xl mx-auto">
                    <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-black shadow-2xl border border-stone-600">
                    {embedUrl ? (
                    <iframe src={embedUrl} className="absolute inset-0 w-full h-full" frameBorder="0" allow="autoplay; encrypted-media" allowFullScreen></iframe>
                    ) : (
                    <div className="flex items-center justify-center h-full text-stone-400 font-bold">הקישור לסרטון אינו תקין...</div>
                    )}
                    </div>
                    <button onClick={() => setShowVideo(false)} className="w-full mt-4 bg-amber-500 hover:bg-amber-600 text-white font-black text-lg p-4 rounded-xl shadow-lg transition-transform hover:-translate-y-1 flex items-center justify-center gap-2">
                    עבור למשחק <Icon name="arrow-left" size={22} />
                    </button>
                    </div>
                    ) : (() => {
                        const maxAttempts = getMaxAttempts(currentStation.type);
                        const attemptInfo = stationAttempts[activeStationId] || { used: 0, max: maxAttempts };
                        const attemptsLeft = maxAttempts - attemptInfo.used;
                        const attemptNumber = attemptInfo.used + 1;
                        const isCompleted = currentStation.completed;

                        // אם כבר השלים וכבר אין ניסיונות → הצג סיכום בלבד
                        if (isCompleted && attemptsLeft <= 0) {
                            return (
                                <div className="max-w-md mx-auto mt-8 bg-white/90 backdrop-blur rounded-2xl shadow-xl p-8 text-center border-t-8 border-green-500 animate-fade-in">
                                    <div className="text-6xl mb-3">🏆</div>
                                    <h2 className="text-2xl font-black text-green-700 mb-2">תחנה הושלמה!</h2>
                                    <p className="text-stone-500 font-bold mb-1">ציון: <span className="text-amber-600 text-xl font-black">{currentStation.score}</span> נקודות</p>
                                    <p className="text-xs text-stone-400 mb-6">ניצלת את כל {maxAttempts} הניסיונות</p>
                                    <button onClick={() => setView('map')} className="w-full bg-amber-500 hover:bg-amber-600 text-white font-black text-lg p-4 rounded-xl">חזרה למפה</button>
                                </div>
                            );
                        }

                        // כפתור שחק שוב (כשהשלים אבל נשארו ניסיונות)
                        const ReplayBanner = isCompleted && attemptsLeft > 0 ? (
                            <div className="max-w-2xl mx-auto mb-3 bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 flex items-center justify-between animate-fade-in">
                                <div>
                                    <span className="font-black text-amber-800">ציון קודם: {currentStation.score}</span>
                                    <span className="text-amber-600 text-sm mr-3">• נשארו {attemptsLeft} ניסיונות</span>
                                </div>
                                <span className="text-xs text-amber-500 bg-amber-100 px-2 py-1 rounded-full font-bold">
                                    {currentStation.type === 'memory' ? '50 נקודות בניסיון 2' : currentStation.type === 'millionaire' ? 'ניסיון חדש!' : ''}
                                </span>
                            </div>
                        ) : null;

                        return (
                            <div>
                            {ReplayBanner}
                            {currentStation.type === 'quiz' && <QuizGame key={`quiz-${attemptInfo.used}`} data={currentStation.data} onComplete={handleStationComplete} />}
                            {currentStation.type === 'memory' && <MatchingGame key={`match-${attemptInfo.used}`} data={currentStation.data} onComplete={handleStationComplete} attemptsLeft={attemptsLeft} attemptNumber={attemptNumber} />}
                            {currentStation.type === 'millionaire' && <MillionaireGame key={`mill-${attemptInfo.used}`} data={currentStation.data} onComplete={handleStationComplete} attemptsLeft={attemptsLeft} attemptNumber={attemptNumber} />}
                            </div>
                        );
                    })()}
                    </div>
                    </div>
                    );
                }
            };

            return renderView();
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            render() {
                if (this.state.hasError) {
                    return (
                    <div className="min-h-screen bg-red-50 text-red-800 flex flex-col items-center justify-center p-6 text-center" dir="rtl">
                    <h1 className="text-3xl md:text-5xl font-black mb-4">אופס! נתקענו 😕</h1>
                    <p className="mb-6 font-bold text-lg max-w-md">קרתה שגיאת תצוגה. לא לדאוג, הנתונים שלך בטוחים.</p>
                    <button onClick={() => window.location.reload()} className="bg-amber-500 hover:bg-amber-600 text-white px-8 py-4 rounded-xl font-black text-xl shadow-lg transition-transform hover:scale-105 mb-4">
                    טען את העמוד מחדש
                    </button>
                    <button onClick={() => {
                    localStorage.removeItem('jerusalemGameConfig');
                    window.location.reload();
                    }} className="text-red-500 underline text-sm">
                    איפוס עמוק (אם הבעיה חוזרת על עצמה)
                    </button>
                    </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
